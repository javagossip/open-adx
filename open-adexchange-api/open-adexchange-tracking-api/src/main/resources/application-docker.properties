# Redis 配置
server.port=8083
spring.application.name=oax-tracking-api
server.servlet.context-path=
spring.threads.virtual.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
# Kafka 配置
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
#spring.kafka.consumer.group-id=oax.domain.events.listener
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# 日志配置
logging.level.root=INFO
logging.level.top.openadexchange=INFO
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
oax.tracking.executor-factory=default
oax.tracking.ad-dedup-service=default
oax.tracking.secret=1234567890123456